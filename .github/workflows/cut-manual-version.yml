# One click from the Actions tab: freezes the current "latest" manual PDF
# as a permanent versioned download and lists it on the downloads page.
name: Cut manual version (freeze latest PDF)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware/manual version, e.g. 3.3.0 (no leading v)"
        required: true

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Freeze current latest PDF as versioned download
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Fetch the server's copy, not Cloudflare's. The site serves PDFs with
          # Cache-Control: max-age=604800, so for up to a week after a deploy the
          # plain URL can still return the PDF from before it. A query string
          # unique to this run misses that cache, and Cloudflare fetches the file
          # from the server.
          curl -fsSL -D "$RUNNER_TEMP/pdf-headers.txt" \
            "https://manuals.arianesline.com/mnemo/pdf/MNemo-UserManual-latest.pdf?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "static/pdf/MNemo-UserManual-v${VERSION}.pdf"
          grep -i -E '^(last-modified|cf-cache-status):' "$RUNNER_TEMP/pdf-headers.txt" || true
          # A cache answer here means Cloudflare no longer keys on the query
          # string, and the copy may predate the last deploy: stop rather than
          # freeze it.
          status=$(grep -i '^cf-cache-status:' "$RUNNER_TEMP/pdf-headers.txt" | tail -n 1 | tr -d '\r' | awk '{print toupper($2)}')
          case "$status" in
            HIT|STALE|UPDATING)
              echo "::error::Cloudflare answered from its cache ($status), so this PDF may predate the last deploy. Purge https://manuals.arianesline.com/mnemo/pdf/MNemo-UserManual-latest.pdf in Cloudflare, then run this workflow again."
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import json, os, datetime
          v = os.environ["VERSION"].lstrip("v")
          p = "src/data/pdfVersions.json"
          d = json.load(open(p))
          if any(e["version"] == v for e in d):
              raise SystemExit(f"version {v} already exists")
          d.append({"version": v,
                    "filename": f"MNemo-UserManual-v{v}.pdf",
                    "date": datetime.date.today().isoformat()})
          open(p, "w").write(json.dumps(d, indent=4) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/pdf "src/data/pdfVersions.json"
          git commit -m "Freeze manual v${VERSION} from latest PDF"
          git push

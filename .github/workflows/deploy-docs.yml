name: Deploy Docusaurus to manuals.arianesline.com

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      # Regenerate the always-current manual PDF from the freshly built site.
      # Frozen per-firmware PDFs live in static/pdf/ and are cut via the
      # "Cut manual version" workflow.
      - name: Generate latest-manual PDF
        run: |
          npx docusaurus serve --port 3123 --no-open &
          for i in $(seq 1 30); do curl -sf http://localhost:3123/mnemo/ >/dev/null && break; sleep 1; done
          npx --yes docs-to-pdf --initialDocURLs="http://localhost:3123/mnemo/docs/Starter" --contentSelector="article" --paginationSelector="a.pagination-nav__link--next" --excludeSelectors=".theme-doc-breadcrumbs,.theme-edit-this-page,.pagination-nav,.theme-doc-toc-mobile" --coverTitle="MNemo V2 — User Manual" --coverSub="Generated $(date -u +%F) — tracks the online manual" --puppeteerArgs="--no-sandbox,--disable-setuid-sandbox" --outputPDFFilename="build/pdf/MNemo-UserManual-latest.pdf"
          kill %1 2>/dev/null || true

      # Ships to the VPS through a write-only rrsync jail scoped to the docs
      # directory (key restricted via command= in authorized_keys).
      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Strip CR: a key pasted into the secret from a Windows editor arrives
          # CRLF-terminated, which OpenSSH rejects with "error in libcrypto".
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail with something actionable rather than an opaque libcrypto error.
          # -y derives the public key, so this validates the private key without
          # printing any of it.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::DOCS_DEPLOY_KEY is not a valid OpenSSH private key. Set it from the key file so its newlines survive, e.g. 'gh secret set DOCS_DEPLOY_KEY --repo <repo> < deploy_key'. A PuTTY .ppk must be converted first."
            exit 1
          fi
          ssh-keyscan -t ed25519 51.161.35.92 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" build/ aline@51.161.35.92:/mnemo
